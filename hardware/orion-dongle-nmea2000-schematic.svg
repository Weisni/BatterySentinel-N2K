<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <style>
      .bg{fill:#fbfcfe}.title{font:700 30px Arial;fill:#102a43}.sub{font:16px Arial;fill:#486581}
      .box{fill:#fff;stroke:#243b53;stroke-width:2;rx:10}.bus{fill:#fff7ed;stroke:#c2410c;stroke-width:2}.logic{fill:#eff6ff;stroke:#1d4ed8;stroke-width:2}
      .chip{fill:#f8fafc;stroke:#334e68;stroke-width:2;rx:8}.pin{font:14px Consolas,monospace;fill:#102a43}.label{font:700 16px Arial;fill:#102a43}.small{font:13px Arial;fill:#334e68}
      .wire{fill:none;stroke:#334e68;stroke-width:3}.power{fill:none;stroke:#dc2626;stroke-width:4}.gnd{fill:none;stroke:#111827;stroke-width:3}.canh{fill:none;stroke:#2563eb;stroke-width:4}.canl{fill:none;stroke:#0f766e;stroke-width:4}
      .iso{fill:#f1f5f9;stroke:#64748b;stroke-width:2;stroke-dasharray:10 8}.dnp{fill:#fef2f2;stroke:#dc2626;stroke-width:2;stroke-dasharray:7 5}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#334e68"/></marker>
  </defs>
  <rect width="1600" height="1000" class="bg"/>
  <text x="55" y="55" class="title">Orion Dongle – ESP32-C3 SuperMini → isolated NMEA 2000</text>
  <text x="55" y="85" class="sub">Powered Micro-C drop node · 250 kbit/s · prototype reference · no 120 Ω termination in normal NMEA use</text>

  <rect x="35" y="115" width="665" height="815" class="bus" rx="18"/>
  <text x="58" y="150" class="label">BUS domain — GND2 = NET-C</text>
  <rect x="900" y="115" width="665" height="815" class="logic" rx="18"/>
  <text x="925" y="150" class="label">LOGIC domain — isolated GND1 / USB</text>
  <rect x="710" y="115" width="180" height="815" class="iso" rx="16"/>
  <text x="800" y="175" text-anchor="middle" class="label" transform="rotate(90 800 175)">ISOLATION BARRIER</text>

  <!-- Micro-C connector -->
  <rect x="65" y="205" width="230" height="270" class="box"/>
  <text x="180" y="238" text-anchor="middle" class="label">J1 Micro-C male</text>
  <text x="90" y="280" class="pin">1 SHIELD · bare</text>
  <text x="90" y="320" class="pin">2 NET-S  · red</text>
  <text x="90" y="360" class="pin">3 NET-C  · black</text>
  <text x="90" y="400" class="pin">4 CAN-H  · white</text>
  <text x="90" y="440" class="pin">5 CAN-L  · blue</text>

  <!-- power input protection -->
  <path d="M295 315 H345" class="power"/>
  <rect x="345" y="292" width="92" height="46" class="chip"/>
  <text x="391" y="320" text-anchor="middle" class="label">F1 0.5 A</text>
  <path d="M437 315 H475" class="power"/>
  <rect x="475" y="285" width="155" height="60" class="chip"/>
  <text x="552" y="310" text-anchor="middle" class="label">Q1 P-MOS</text>
  <text x="552" y="332" text-anchor="middle" class="small">reverse polarity</text>
  <path d="M630 315 H660 V535 H600" class="power"/>
  <text x="642" y="300" class="small">BUS_12V</text>
  <path d="M295 355 H670 V815" class="gnd"/>
  <text x="305" y="378" class="small">GND2</text>
  <rect x="490" y="365" width="140" height="34" class="chip"/>
  <text x="560" y="388" text-anchor="middle" class="small">D1 SMBJ20A · TVS</text>
  <path d="M560 365 V345 M560 399 H645 V355" class="wire"/>

  <!-- bus side regulator -->
  <rect x="420" y="575" width="180" height="100" class="chip"/>
  <text x="510" y="605" text-anchor="middle" class="label">U3 LM2936-5.0</text>
  <text x="510" y="630" text-anchor="middle" class="small">BUS_12V → 5V_BUS</text>
  <text x="510" y="654" text-anchor="middle" class="small">10 µF + 100 nF</text>
  <path d="M600 605 H660" class="power"/>
  <path d="M510 675 V815" class="gnd"/>
  <path d="M420 625 H380 V675 H710" class="power"/>
  <text x="390" y="660" class="small">5V_BUS</text>

  <!-- isolated dc/dc -->
  <rect x="500" y="710" width="190" height="105" class="chip"/>
  <text x="595" y="742" text-anchor="middle" class="label">U2 R3M-2405S</text>
  <text x="595" y="766" text-anchor="middle" class="small">9–36 V → 5 V / 600 mA</text>
  <text x="595" y="790" text-anchor="middle" class="small">1.6 kVDC isolated</text>
  <path d="M660 710 V535" class="power"/>
  <path d="M500 785 H470 V815 H670" class="gnd"/>
  <path d="M690 745 H745" class="power"/>
  <path d="M690 790 H745" class="gnd"/>
  <text x="712" y="733" class="small">+5V</text>
  <text x="712" y="812" class="small">GND1</text>

  <!-- ISO1042 -->
  <rect x="680" y="310" width="240" height="250" class="chip"/>
  <text x="800" y="345" text-anchor="middle" class="label">U1 ISO1042DWV</text>
  <line x1="800" y1="360" x2="800" y2="540" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="730" y="392" class="pin">8 VCC2</text><text x="825" y="392" class="pin">1 VCC1</text>
  <text x="730" y="432" class="pin">7 CANH</text><text x="825" y="432" class="pin">2 TXD</text>
  <text x="730" y="472" class="pin">6 CANL</text><text x="825" y="472" class="pin">3 RXD</text>
  <text x="730" y="512" class="pin">5 GND2</text><text x="825" y="512" class="pin">4 GND1</text>
  <path d="M710 385 H675 V675" class="power"/>
  <path d="M710 505 H670 V815" class="gnd"/>

  <!-- CAN protection -->
  <path d="M680 425 H600" class="canh"/>
  <path d="M680 465 H600" class="canl"/>
  <rect x="480" y="405" width="120" height="80" class="chip"/>
  <text x="540" y="435" text-anchor="middle" class="label">L1 CMC</text>
  <text x="540" y="458" text-anchor="middle" class="small">2 × 51 µH</text>
  <path d="M480 425 H295" class="canh"/>
  <path d="M480 465 H315 V435 H295" class="canl"/>
  <rect x="335" y="395" width="110" height="72" class="chip"/>
  <text x="390" y="423" text-anchor="middle" class="label">D3</text>
  <text x="390" y="445" text-anchor="middle" class="small">CAN TVS</text>
  <path d="M390 467 V815" class="gnd"/>
  <rect x="310" y="500" width="145" height="58" class="dnp" rx="8"/>
  <text x="382" y="525" text-anchor="middle" class="label">RTERM 120 Ω</text>
  <text x="382" y="547" text-anchor="middle" class="small">DNP for NMEA</text>
  <path d="M335 500 V425 M430 500 V465" class="wire"/>

  <!-- Logic side and ESP -->
  <path d="M920 385 H1020" class="power"/>
  <path d="M920 425 H970" class="wire"/>
  <rect x="970" y="405" width="70" height="40" class="chip"/>
  <text x="1005" y="430" text-anchor="middle" class="small">33 Ω</text>
  <path d="M1040 425 H1120" class="wire" marker-end="url(#arrow)"/>
  <path d="M1120 465 H1040" class="wire" marker-end="url(#arrow)"/>
  <rect x="970" y="445" width="70" height="40" class="chip"/>
  <text x="1005" y="470" text-anchor="middle" class="small">33 Ω</text>
  <path d="M920 505 H1090 V695" class="gnd"/>

  <rect x="1120" y="275" width="335" height="370" class="chip"/>
  <text x="1288" y="315" text-anchor="middle" class="title" style="font-size:23px">ESP32-C3 SuperMini</text>
  <text x="1150" y="385" class="pin">3V3  → ISO VCC1</text>
  <text x="1150" y="430" class="pin">GPIO6 → CAN TXD</text>
  <text x="1150" y="475" class="pin">GPIO7 ← CAN RXD</text>
  <text x="1150" y="520" class="pin">GND   → GND1</text>
  <text x="1150" y="565" class="pin">5V    ← D2 / 5V_ISO</text>
  <rect x="1230" y="590" width="115" height="38" class="logic" rx="6"/>
  <text x="1288" y="615" text-anchor="middle" class="label">USB-C service</text>

  <path d="M745 745 H930" class="power"/>
  <rect x="930" y="722" width="120" height="46" class="chip"/>
  <text x="990" y="751" text-anchor="middle" class="label">D2 Schottky</text>
  <path d="M1050 745 H1390 V565" class="power"/>
  <path d="M745 790 H1090 V520 H1120" class="gnd"/>
  <text x="955" y="790" class="small">47 µF + 100 nF</text>

  <!-- shield -->
  <path d="M295 275 H370" class="wire"/>
  <rect x="370" y="250" width="170" height="50" class="box"/>
  <text x="455" y="281" text-anchor="middle" class="label">CHASSIS pad only</text>
  <text x="82" y="895" class="small">Micro-C: 1 shield · 2 NET-S red · 3 NET-C black · 4 CAN-H white · 5 CAN-L blue</text>
  <text x="925" y="895" class="small">Keep USB and all service equipment on GND1. Never bridge GND1 to NET-C/GND2.</text>
</svg>
