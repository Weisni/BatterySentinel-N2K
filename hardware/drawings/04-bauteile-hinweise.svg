<text x="268" y="44" font-family="Arial, sans-serif" font-size="3.5" font-weight="700" fill="#9a4e12" text-anchor="start">Vor einer Platinenbestellung</text>
<text x="270" y="51" font-family="Arial, sans-serif" font-size="2.75" font-weight="400" fill="#182f41" text-anchor="start">1. SuperMini-Pinfolge, USB-Überstand und Header messen.</text>
<text x="270" y="59" font-family="Arial, sans-serif" font-size="2.75" font-weight="400" fill="#182f41" text-anchor="start">2. U1/U2-Landpatterns aus Originaldaten übernehmen.</text>
<text x="270" y="67" font-family="Arial, sans-serif" font-size="2.75" font-weight="400" fill="#182f41" text-anchor="start">3. F1, J1 und JP1 als konkrete Bestellteile festlegen.</text>
<text x="270" y="75" font-family="Arial, sans-serif" font-size="2.75" font-weight="400" fill="#182f41" text-anchor="start">4. ERC, DRC und 3D-Kollisionstest im ECAD durchführen.</text>
<text x="270" y="83" font-family="Arial, sans-serif" font-size="2.75" font-weight="400" fill="#182f41" text-anchor="start">5. Erst danach Gerber, Bohr- und Bestückungsdaten.</text>
<rect x="264" y="105" width="142" height="69" fill="#fcfcfd" stroke="#d6dfe4" stroke-width="0.3" rx="2"/>
<text x="268" y="112" font-family="Arial, sans-serif" font-size="3.5" font-weight="700" fill="#9a4e12" text-anchor="start">Elektrische Auslegung noch zu verifizieren</text>
<text x="270" y="119" font-family="Arial, sans-serif" font-size="2.65" font-weight="400" fill="#182f41" text-anchor="start">U2: mindestens 9 V hinter F1/Q1/Filter erforderlich.</text>
<text x="270" y="126" font-family="Arial, sans-serif" font-size="2.65" font-weight="400" fill="#182f41" text-anchor="start">9-V-NET-S-Betrieb ist damit nicht garantiert.</text>
<text x="270" y="133" font-family="Arial, sans-serif" font-size="2.65" font-weight="400" fill="#182f41" text-anchor="start">RECOM-Class-B-Filter enthält zusätzlich 470 pF</text>
<text x="270" y="140" font-family="Arial, sans-serif" font-size="2.65" font-weight="400" fill="#182f41" text-anchor="start">über der Isolation; hier weggelassen, keine Class-B-Zusage.</text>
<text x="270" y="147" font-family="Arial, sans-serif" font-size="2.65" font-weight="400" fill="#182f41" text-anchor="start">U3: (16 V - 5 V) x 73,4 mA = ca. 0,81 W.</text>
<text x="270" y="154" font-family="Arial, sans-serif" font-size="2.65" font-weight="400" fill="#182f41" text-anchor="start">Wärmefläche aus Blatt 3 ist Startwert, keine Thermikfreigabe.</text>
<text x="270" y="161" font-family="Arial, sans-serif" font-size="2.65" font-weight="400" fill="#182f41" text-anchor="start">LEN aus gemessenem Maximalstrom bestimmen.</text>
<rect x="264" y="180" width="142" height="45" fill="#fcfcfd" stroke="#d6dfe4" stroke-width="0.3" rx="2"/>
<text x="268" y="187" font-family="Arial, sans-serif" font-size="3.5" font-weight="700" fill="#9a4e12" text-anchor="start">Erstinbetriebnahme</text>
<text x="270" y="194" font-family="Arial, sans-serif" font-size="2.8" font-weight="400" fill="#182f41" text-anchor="start">Strombegrenztes Labornetzteil; zunächst ohne CAN.</text>
<text x="270" y="201" font-family="Arial, sans-serif" font-size="2.8" font-weight="400" fill="#182f41" text-anchor="start">5V_BUS, 5V_MODULE und 3V3_LOGIC messen.</text>
<text x="270" y="208" font-family="Arial, sans-serif" font-size="2.8" font-weight="400" fill="#182f41" text-anchor="start">Trennung beider Massen und USB-Jumper prüfen.</text>
<text x="270" y="215" font-family="Arial, sans-serif" font-size="2.8" font-weight="400" fill="#182f41" text-anchor="start">Danach CAN mit korrekt terminiertem Prüfnetz testen.</text>
