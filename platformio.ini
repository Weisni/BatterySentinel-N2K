[platformio]
default_envs = orion_dongle

[env]
lib_ldf_mode = deep+
build_flags =
    -std=gnu++17

[env:esp32c3]
# Original 8 MB battery-monitor board; not the 4 MB SuperMini dongle.
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 8MB
board_build.flash_size = 8MB
board_build.partitions = partitions_8mb_ota.csv
build_unflags =
    -std=gnu++11
lib_deps =
    https://github.com/ttlappalainen/NMEA2000.git
build_flags =
    ${env.build_flags}
    -D BATTERYSENTINEL_FIRMWARE=1
build_src_filter =
    +<*>
    -<dongle_main.cpp>
    -<BridgePortal.cpp>
    -<BridgeSettings.cpp>
    -<OrionBleReceiver.cpp>

[env:orion_dongle]
# 4 MB ESP32-C3 SuperMini. Keep OTA/app offsets aligned with PlatformIO upload.
extends = env:esp32c3
board_upload.flash_size = 4MB
board_build.flash_size = 4MB
board_build.partitions = partitions_4mb_ota.csv
build_src_filter =
    +<NmeaPublisher.cpp>
    +<Nmea2000Twai.cpp>
    +<BridgePortal.cpp>
    +<BridgeSettings.cpp>
    +<OrionBleReceiver.cpp>
    +<dongle_main.cpp>
build_flags =
    ${env.build_flags}
    -D BATTERYSENTINEL_ORION_DONGLE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_LOOP_STACK_SIZE=16384

[env:native]
platform = native
test_framework = unity
test_build_src = no
build_flags =
    ${env.build_flags}
    -D BATTERYSENTINEL_NATIVE=1
    -D UNITY_INCLUDE_DOUBLE
