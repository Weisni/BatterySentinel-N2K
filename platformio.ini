[platformio]
default_envs = orion_dongle

[env]
lib_ldf_mode = deep+
build_flags =
    -std=gnu++17

[env:esp32c3]
# Original 8 MB battery-monitor board; not the 4 MB SuperMini dongle.
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 8MB
board_build.flash_size = 8MB
board_build.partitions = partitions_8mb_ota.csv
build_unflags =
    -std=gnu++11
lib_deps =
    https://github.com/ttlappalainen/NMEA2000.git
build_flags =
    ${env.build_flags}
    -D BATTERYSENTINEL_FIRMWARE=1
build_src_filter =
    +<*>
    -<dongle_main.cpp>
    -<BridgePortal.cpp>
    -<BridgeFirmwareIdentity.cpp>
    -<BridgeSettings.cpp>
    -<OrionBleReceiver.cpp>

[env:orion_dongle]
# 4 MB ESP32-C3 SuperMini. Keep OTA/app offsets aligned with PlatformIO upload.
extends = env:esp32c3
board_upload.flash_size = 4MB
board_build.flash_size = 4MB
board_build.partitions = partitions_4mb_ota.csv
build_src_filter =
    +<NmeaPublisher.cpp>
    +<Nmea2000Twai.cpp>
    +<BridgePortal.cpp>
    +<BridgeFirmwareIdentity.cpp>
    +<BridgeSettings.cpp>
    +<BridgeDiagnostics.cpp>
    +<OrionBleReceiver.cpp>
    +<dongle_main.cpp>
build_flags =
    ${env.build_flags}
    -D BATTERYSENTINEL_ORION_DONGLE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_LOOP_STACK_SIZE=16384

[env:orion_r4]
# R4 assembled PCB: ESP32-C3-WROOM-02-N4, native USB, 4 MB flash.
extends = env:orion_dongle
board = esp32-c3-devkitc-02
upload_protocol = esptool
build_flags =
    ${env:orion_dongle.build_flags}
    -D BATTERYSENTINEL_ORION_R4=1

[env:orion_debug_oled]
# Separate 4 MB C3 OLED debug jig: OLED SDA5/SCL6, CAN TX4/RX7.
extends = env:orion_dongle
lib_deps =
    ${env:esp32c3.lib_deps}
    olikraus/U8g2@2.36.5
build_src_filter =
    ${env:orion_dongle.build_src_filter}
    +<BridgeDebugDisplay.cpp>
build_flags =
    ${env:orion_dongle.build_flags}
    -D BATTERYSENTINEL_DEBUG_OLED=1

[env:native]
platform = native
test_framework = unity
test_build_src = no
build_flags =
    ${env.build_flags}
    -D BATTERYSENTINEL_NATIVE=1
    -D UNITY_INCLUDE_DOUBLE
