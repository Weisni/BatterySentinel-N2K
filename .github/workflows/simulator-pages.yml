name: Internal simulator checks

on:
  push:
    branches: [main]
    paths:
      - 'sim/web/**'
      - '.github/workflows/simulator-pages.yml'
  pull_request:
    paths:
      - 'sim/web/**'
      - '.github/workflows/simulator-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check internal simulator JavaScript
        run: node --check sim/web/app.js
