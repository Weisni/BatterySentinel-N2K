name: BatterySentinel Lab Pages

on:
  push:
    branches: [main]
    paths:
      - 'sim/web/**'
      - '.github/workflows/simulator-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload simulator
        uses: actions/upload-pages-artifact@v3
        with:
          path: sim/web
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
